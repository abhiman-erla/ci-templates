name: terraform-validate

# Reusable. Runs `terraform fmt -check -recursive`, `init -backend=false` and
# `validate` with a pinned Terraform. No credentials, no backend, no plan.
# terraform_wrapper is off so the real exit codes and output reach the step.
# self-test.yml extracts the marked blocks below and runs them against
# planted defects.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with the Terraform configuration, relative to the repo root
        type: string
        default: .
      terraform-version:
        description: Exact Terraform version, for example 1.9.8
        type: string
        default: "1.9.8"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          IN_VERSION: ${{ inputs.terraform-version }}
          IN_WD: ${{ inputs.working-directory }}
        run: |
          # >>> validate
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          re_version='^[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9.]+)?$'
          re_dir='^[A-Za-z0-9_.][A-Za-z0-9_./-]*$'
          [[ $IN_VERSION =~ $re_version ]] || fail "terraform-version must be an exact version like 1.9.8, got ${IN_VERSION@Q}"
          [[ $IN_WD =~ $re_dir ]] || fail "working-directory has unsupported characters: ${IN_WD@Q}"
          case "/$IN_WD/" in *"/../"*) fail "working-directory may not contain .." ;; esac
          [ -d "$IN_WD" ] || fail "working-directory ${IN_WD@Q} is not a directory"
          echo "inputs OK"
          # <<< validate

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: ${{ inputs.working-directory }}
        run: |
          # >>> fmt
          terraform fmt -check -recursive -diff
          # <<< fmt

      - name: terraform init
        working-directory: ${{ inputs.working-directory }}
        run: |
          # >>> init
          terraform init -backend=false -input=false
          # <<< init

      - name: terraform validate
        working-directory: ${{ inputs.working-directory }}
        run: |
          # >>> validate-config
          terraform validate
          # <<< validate-config
