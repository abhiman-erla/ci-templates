name: self-test

# Proves the reusable workflows in this repo work AND that they fail when they
# should. "Positive" jobs call the reusable workflows on this repo. "Negative"
# jobs run the same pinned tools against planted bad input and require a
# non-zero exit: a reusable-workflow call that fails would fail this run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Tool pins used by the negative jobs. The same values are in the reusable
# workflows; the drift-check job fails if they ever differ.
env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: "1.31.0"
  ZIZMOR_SHA256: 95776c59c2d4c0d6e10560647b4830762b8dbcca8d7d9b7469ff227c73a6fee6
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: "0.69.3"
  TRIVY_IMAGE_DIGEST: sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml
    permissions:
      contents: read

  node-ci:
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      working-directory: fixtures/node-app
      setup-command: touch .setup-done
      test-env: |
        FIXTURE_FLAG=a=b c

  # Skip paths: no install (so no npm cache), no lint, no audit.
  node-ci-no-install:
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      install-command: ""
      lint-command: ""
      test-command: node --version
      audit: false

  # push: false, so no package is ever created by this repo's self-test. The
  # caller must still grant packages: write or the called workflow cannot start;
  # that grant is only a ceiling, nothing is pushed. The bare image-name also
  # exercises the ghcr.io/<owner>/<name> prefixing.
  docker-build:
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write # ceiling for the called workflow; push is false
    with:
      context: fixtures/node-app
      image-name: ci-templates-fixture
      push: false
      smoke-path: /healthz
      smoke-env: |
        SMOKE_FLAG=on

  # With push off, the outputs must be empty. The assertion block is shared with
  # output-assertions-unit, which proves it can fail.
  docker-build-outputs:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE: ${{ needs.docker-build.outputs.image }}
      DIGEST: ${{ needs.docker-build.outputs.digest }}
      NAME: ghcr.io/abhiman-erla/ci-templates-fixture
      EXPECT: empty
    steps:
      - name: Assert outputs
        run: |
          # >>> assert-outputs
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "$EXPECT" in
            empty)
              [ -z "$DIGEST" ] || fail "digest should be empty, got '$DIGEST'"
              [ -z "$IMAGE" ] || fail "image should be empty, got '$IMAGE'"
              ;;
            pushed)
              [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || fail "digest is not sha256:<64 hex>: '$DIGEST'"
              [ "$IMAGE" = "${NAME}@${DIGEST}" ] || fail "image '$IMAGE' is not ${NAME}@${DIGEST}"
              ;;
            *) fail "EXPECT must be empty or pushed" ;;
          esac
          echo "output assertions OK ($EXPECT)"
          # <<< assert-outputs

  # The pushed-output shape cannot be produced without pushing, so the shared
  # assertion block is run on sample values, good and bad.
  output-assertions-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assertion block accepts good values and rejects bad ones
        run: |
          set -euo pipefail
          sed -n '/# >>> assert-outputs$/,/# <<< assert-outputs$/p' .github/workflows/self-test.yml | sed '1d;$d' > "$RUNNER_TEMP/assert.sh"
          [ -s "$RUNNER_TEMP/assert.sh" ] || { echo "::error::assert-outputs block not found"; exit 1; }
          fails=0
          good="sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          name=ghcr.io/o/x
          t() { # label ok|bad EXPECT IMAGE DIGEST
            local rc=0
            EXPECT=$3 IMAGE=$4 DIGEST=$5 NAME=$name bash "$RUNNER_TEMP/assert.sh" > /dev/null 2>&1 || rc=$?
            if { [ "$2" = ok ] && [ "$rc" -eq 0 ]; } || { [ "$2" = bad ] && [ "$rc" -ne 0 ]; }; then echo "ok   $1"
            else echo "::error::$1 (expected $2, rc=$rc)"; fails=1; fi
          }
          [ "${#good}" -eq 71 ] || { echo "::error::test setup: bad sample digest"; exit 1; }
          t "empty outputs, expect empty" ok empty "" ""
          t "digest set, expect empty" bad empty "" "$good"
          t "image set, expect empty" bad empty "$name@$good" ""
          t "good pushed values" ok pushed "$name@$good" "$good"
          t "empty values, expect pushed" bad pushed "" ""
          t "digest too short" bad pushed "$name@sha256:abc" "sha256:abc"
          t "digest upper-case hex" bad pushed "$name@${good^^}" "${good^^}"
          t "digest missing prefix" bad pushed "$name@${good#sha256:}" "${good#sha256:}"
          t "image uses a tag, not the digest" bad pushed "$name:latest" "$good"
          t "image has the wrong name" bad pushed "ghcr.io/o/y@$good" "$good"
          t "unknown EXPECT" bad other "" ""
          exit "$fails"

  # Inputs reach the validate block as data; check what it accepts and produces.
  docker-build-input-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate block cases
        run: |
          set -euo pipefail
          sed -n '/# >>> validate$/,/# <<< validate$/p' .github/workflows/docker-build.yml | sed '1d;$d' > "$RUNNER_TEMP/validate.sh"
          [ -s "$RUNNER_TEMP/validate.sh" ] || { echo "::error::validate block not found"; exit 1; }
          base_re=$(grep -E '^ +CHANGE_RE:' .github/workflows/docker-build.yml | head -1 | sed -E "s/^ +CHANGE_RE: *'//; s/'\$//")
          fails=0
          run_v() { # context dockerfile image port path
            : > "$RUNNER_TEMP/v-out"
            GITHUB_OUTPUT="$RUNNER_TEMP/v-out" GITHUB_REPOSITORY=Abhiman-Erla/Helios GITHUB_REPOSITORY_OWNER=Abhiman-Erla GITHUB_SHA=abc123 CHANGE_RE="$base_re" \
              IN_CONTEXT=$1 IN_DOCKERFILE=$2 IN_IMAGE_NAME=$3 IN_PORT=$4 IN_PATH=$5 bash "$RUNNER_TEMP/validate.sh" > /dev/null 2>&1
          }
          got() { sed -n "s/^$1=//p" "$RUNNER_TEMP/v-out"; }
          want_image() { # label expected context dockerfile image
            if run_v "$3" "$4" "$5" 3000 /healthz && [ "$(got image)" = "$2" ]; then echo "ok   $1 -> $2"
            else echo "::error::$1: expected image $2, got '$(got image)'"; fails=1; fi
          }
          want_reject() { # label context dockerfile image port path
            if run_v "$2" "$3" "$4" "$5" "$6"; then echo "::error::accepted: $1"; fails=1; else echo "ok   rejected: $1"; fi
          }
          want_image "bare name gets ghcr.io/<owner>/" ghcr.io/abhiman-erla/ethos fixtures/node-app "" ethos
          want_image "full name kept" ghcr.io/o/x fixtures/node-app "" ghcr.io/o/x
          want_image "empty name is the repository" ghcr.io/abhiman-erla/helios fixtures/node-app "" ""
          want_reject "upper-case bare name" fixtures/node-app "" Ethos 3000 /
          want_reject "other registry" fixtures/node-app "" docker.io/x/y 3000 /
          want_reject "upper-case full name" fixtures/node-app "" ghcr.io/O/y 3000 /
          want_reject "context starting with -" -x "" "" 3000 /
          want_reject "context with a semicolon" 'a;rm' "" "" 3000 /
          want_reject "missing Dockerfile" fixtures/node-app nope/Dockerfile "" 3000 /
          want_reject "port out of range" fixtures/node-app "" "" 70000 /
          want_reject "path without a slash" fixtures/node-app "" "" 3000 x
          want_reject "path with command substitution" fixtures/node-app "" "" 3000 "/\$(id)"
          run_v . fixtures/node-app/Dockerfile "" 3000 /
          if grep -q '^change-re=.*|^fixtures/node-app/Dockerfile\$$' "$RUNNER_TEMP/v-out"; then
            echo "ok   change-re includes the resolved dockerfile path"
          else
            echo "::error::change-re does not include the dockerfile path"; fails=1
          fi
          exit "$fails"

  # Only a 2xx is healthy: a 302 must not pass (curl -f alone would accept it).
  boot-test-rejects-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the node fixture
        run: docker build --tag node-app:test fixtures/node-app

      - name: 2xx passes, 3xx fails
        run: |
          set -euo pipefail
          sed -n '/# >>> boot-test$/,/# <<< boot-test$/p' .github/workflows/docker-build.yml | sed '1d;$d' > "$RUNNER_TEMP/boot-test.sh"
          [ -s "$RUNNER_TEMP/boot-test.sh" ] || { echo "::error::boot-test block not found"; exit 1; }
          boot() { IMAGE_REF=node-app:test SMOKE_PORT=3000 SMOKE_PATH=$1 SMOKE_ENV="SMOKE_FLAG=on" bash "$RUNNER_TEMP/boot-test.sh" 2>&1; }
          boot /healthz > /dev/null
          echo "OK: control, /healthz answers 200"
          set +e
          out=$(boot /redirect)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "::error::boot test accepted a 302"; exit 1; fi
          grep -q 'no 2xx answer' <<<"$out" || { echo "::error::expected the no-2xx failure (exit $rc)"; exit 1; }
          echo "OK: boot test rejected a redirect (exit $rc)"

  # The Trivy gate, run exactly as docker-build.yml runs it (extracted block), must
  # fail on a digest-pinned, known-vulnerable public image and must not pass an
  # image it could not scan. Needs the vulnerability DB (network).
  trivy-gate-trips:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # alpine 3.10.0 (index digest, checked on Docker Hub): 12 fixed HIGH/CRITICAL findings
      VULN_IMAGE: alpine@sha256:ca1c944a4f8486a153024d9965aafbe24f5723c1d5c02f4964c045a16d19dc54
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract the scan block
        run: |
          set -euo pipefail
          sed -n '/# >>> trivy-scan$/,/# <<< trivy-scan$/p' .github/workflows/docker-build.yml | sed '1d;$d' > "$RUNNER_TEMP/trivy-scan.sh"
          [ -s "$RUNNER_TEMP/trivy-scan.sh" ] || { echo "::error::trivy-scan block not found"; exit 1; }

      - name: Known-vulnerable image must fail with a CVE in the output
        run: |
          set -euo pipefail
          docker pull --quiet "$VULN_IMAGE"
          docker tag "$VULN_IMAGE" vulnerable:test
          set +e
          out=$(IMAGE_REF=vulnerable:test bash "$RUNNER_TEMP/trivy-scan.sh" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "::error::Trivy gate passed a known-vulnerable image"; exit 1; fi
          grep -q 'CVE-' <<<"$out" || { echo "::error::expected a CVE in the Trivy output (exit $rc)"; exit 1; }
          echo "OK: Trivy gate rejected the vulnerable image (exit $rc)"

      - name: An image with nothing to scan must not pass
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/empty-image"
          mkdir -p "$d"
          echo nothing > "$d/marker.txt"
          printf 'FROM scratch\nCOPY marker.txt /marker.txt\n' > "$d/Dockerfile"
          docker build --quiet --tag empty:test "$d"
          set +e
          out=$(IMAGE_REF=empty:test bash "$RUNNER_TEMP/trivy-scan.sh" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "::error::Trivy gate passed an image it could not scan"; exit 1; fi
          grep -q 'found no OS or packages' <<<"$out" || { echo "::error::expected the nothing-scanned failure (exit $rc)"; exit 1; }
          echo "OK: Trivy gate failed an unscannable image (exit $rc)"

  # npm audit, run as node-ci.yml runs it (extracted block): a lockfile with a
  # known-vulnerable package must fail, a clean one must pass.
  npm-audit-gate-trips:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vulnerable lockfile fails, clean lockfile passes
        run: |
          set -euo pipefail
          sed -n '/# >>> npm-audit$/,/# <<< npm-audit$/p' .github/workflows/node-ci.yml | sed '1d;$d' > "$RUNNER_TEMP/npm-audit.sh"
          [ -s "$RUNNER_TEMP/npm-audit.sh" ] || { echo "::error::npm-audit block not found"; exit 1; }
          (cd fixtures/node-app && bash "$RUNNER_TEMP/npm-audit.sh")
          echo "OK: control, node-app audits clean"
          set +e
          out=$(cd fixtures/vulnerable-npm-app && bash "$RUNNER_TEMP/npm-audit.sh" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "::error::npm audit passed a known-vulnerable lockfile"; exit 1; fi
          grep -qiE 'severity: (high|critical)' <<<"$out" || { echo "::error::expected a high or critical finding (exit $rc)"; exit 1; }
          echo "OK: npm audit rejected the vulnerable lockfile (exit $rc)"

  # A failing reusable call would fail this whole run, so the negative case runs
  # the boot-test block extracted from docker-build.yml (the same text the real
  # workflow runs) and requires it to fail.
  crashing-app-fails-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the crashing fixture
        run: docker build --tag crashing-app:test fixtures/crashing-app

      - name: Boot test must fail
        run: |
          set -euo pipefail
          sed -n '/# >>> boot-test$/,/# <<< boot-test$/p' .github/workflows/docker-build.yml | sed '1d;$d' > "$RUNNER_TEMP/boot-test.sh"
          [ -s "$RUNNER_TEMP/boot-test.sh" ] || { echo "::error::boot-test block not found"; exit 1; }
          set +e
          out=$(IMAGE_REF=crashing-app:test SMOKE_PORT=3000 SMOKE_PATH=/healthz SMOKE_ENV="" bash "$RUNNER_TEMP/boot-test.sh" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "::error::boot test passed a crashing app"; exit 1; fi
          grep -q 'did not stay up' <<<"$out" || { echo "::error::expected the container-exited failure (exit $rc)"; exit 1; }
          echo "OK: boot test rejected the crashing app (exit $rc)"

  # The change helper is inline in node-ci.yml and docker-build.yml. This job
  # extracts the marked block from each file and runs it against a scratch repo.
  change-helper-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two steps: actionlint on Windows stalls on a run script of 4 KiB or more, and
      # shorter steps are easier to read anyway.
      - name: Extract the blocks and build a scratch repo
        run: |
          set -euo pipefail
          wf="$PWD/.github/workflows"
          extract() { sed -n "/# >>> $2\$/,/# <<< $2\$/p" "$1" | sed '1d;$d'; }
          regex_of() { grep -E '^ +CHANGE_RE:' "$1" | head -1 | sed -E "s/^ +CHANGE_RE: *'//; s/'\$//"; }
          extract "$wf/node-ci.yml" change-helper > "$RUNNER_TEMP/helper-node-ci.sh"
          extract "$wf/docker-build.yml" change-helper > "$RUNNER_TEMP/helper-docker-build.sh"
          extract "$wf/docker-build.yml" validate > "$RUNNER_TEMP/validate.sh"
          for f in "helper-node-ci" "helper-docker-build" "validate"; do
            [ -s "$RUNNER_TEMP/$f.sh" ] || { echo "::error::block missing: $f"; exit 1; }
          done
          regex_of "$wf/node-ci.yml" > "$RUNNER_TEMP/re-node-ci"
          regex_of "$wf/docker-build.yml" > "$RUNNER_TEMP/re-docker-build"

          r="$RUNNER_TEMP/helper-repo"
          rm -rf "$r"; mkdir -p "$r"; cd "$r"
          git init -q -b main
          git config user.name tester
          git config user.email tester@example.invalid
          commit() { git add -A; git commit -q -m "$1"; git rev-parse HEAD; }
          echo hello > README.md;                          c0=$(commit base)
          mkdir docs; echo x > docs/guide.md;              c1=$(commit docs)
          echo '{}' > package-lock.json;                   c2=$(commit lockfile)
          echo 'FROM scratch' > Dockerfile;                c3=$(commit dockerfile)
          echo x > docs/xpackage-lock.json;                c4=$(commit lookalike)
          mkdir -p app; echo '{}' > app/package.json;      c5=$(commit nested-package-json)
          echo x > Dockerfile.prod;                        c6=$(commit dockerfile-prod)
          echo x > api.Dockerfile;                         c7=$(commit named-dockerfile)
          echo x > Containerfile;                          c8=$(commit containerfile)
          mkdir -p docker; echo x > docker/api.prod;       c9=$(commit custom-dockerfile)
          { echo "c0=$c0"; echo "c1=$c1"; echo "c2=$c2"; echo "c3=$c3"; echo "c4=$c4"; echo "c5=$c5"; echo "c6=$c6"; echo "c7=$c7"; echo "c8=$c8"; echo "c9=$c9"; } > "$RUNNER_TEMP/shas.env"

      - name: Docs-only is false; lockfile, Dockerfile and unusable bases are true
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/shas.env"
          declare -A res
          res[node-ci]=$(cat "$RUNNER_TEMP/re-node-ci")
          res[docker-build]=$(cat "$RUNNER_TEMP/re-docker-build")
          cd "$RUNNER_TEMP/helper-repo"
          zero=0000000000000000000000000000000000000000
          bad_re="(" # unmatched parenthesis: grep -E exits 2
          unknown=deadbeefdeadbeefdeadbeefdeadbeefdeadbeef

          fails=0
          check() { # workflow base head expected label [regex]
            local name=$1 base=$2 head=$3 want=$4 label=$5 re out got
            re=${6:-${res[$name]}}
            out="$RUNNER_TEMP/out-$name"; : > "$out"
            BASE=$base HEAD=$head RE=$re GITHUB_OUTPUT=$out bash "$RUNNER_TEMP/helper-$name.sh"
            got=$(cat "$out")
            if [ "$got" = "changed=$want" ]; then echo "ok   $name: $label -> $got"
            else echo "::error::$name: $label expected changed=$want, got '$got'"; fails=1; fi
          }
          for name in node-ci docker-build; do
            check "$name" "$c0" "$c1" false "docs-only change"
            check "$name" "$c1" "$c2" true  "lockfile change"
            check "$name" "$c3" "$c4" false "lookalike file name"
            check "$name" "$c4" "$c5" true  "nested package.json"
            check "$name" "$unknown" "$c3" true "unknown base"
            check "$name" "$c0" "$unknown" true "unknown head"
            check "$name" "$zero" "$c3" true "zero base SHA"
            check "$name" "" "$c3" true "empty base"
            check "$name" "$c0" "$c1" true "invalid regex, grep exit 2, counts as changed" "$bad_re"
          done
          exit "$fails"

      - name: Dockerfile variants and the resolved dockerfile path
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/shas.env"
          declare -A res
          res[node-ci]=$(cat "$RUNNER_TEMP/re-node-ci")
          res[docker-build]=$(cat "$RUNNER_TEMP/re-docker-build")
          cd "$RUNNER_TEMP/helper-repo"
          fails=0
          check() { # workflow base head expected label [regex]
            local name=$1 base=$2 head=$3 want=$4 label=$5 re out got
            re=${6:-${res[$name]}}
            out="$RUNNER_TEMP/out-$name"; : > "$out"
            BASE=$base HEAD=$head RE=$re GITHUB_OUTPUT=$out bash "$RUNNER_TEMP/helper-$name.sh"
            got=$(cat "$out")
            if [ "$got" = "changed=$want" ]; then echo "ok   $name: $label -> $got"
            else echo "::error::$name: $label expected changed=$want, got '$got'"; fails=1; fi
          }
          check docker-build "$c2" "$c3" true  "Dockerfile change"
          check node-ci      "$c2" "$c3" false "Dockerfile change is not an audit trigger"
          check docker-build "$c5" "$c6" true  "Dockerfile.prod"
          check docker-build "$c6" "$c7" true  "api.Dockerfile"
          check docker-build "$c7" "$c8" true  "Containerfile"
          check node-ci      "$c5" "$c6" false "Dockerfile.prod is not an audit trigger"
          check docker-build "$c8" "$c9" false "custom Dockerfile path is missed by the base regex alone"
          # The validate block adds the resolved dockerfile input to the regex.
          : > "$RUNNER_TEMP/v-out"
          GITHUB_OUTPUT="$RUNNER_TEMP/v-out" GITHUB_REPOSITORY=o/r GITHUB_REPOSITORY_OWNER=o GITHUB_SHA=abc CHANGE_RE="${res[docker-build]}" \
            IN_CONTEXT=. IN_DOCKERFILE=docker/api.prod IN_IMAGE_NAME="" IN_PORT=3000 IN_PATH=/ bash "$RUNNER_TEMP/validate.sh" > /dev/null
          custom_re=$(sed -n 's/^change-re=//p' "$RUNNER_TEMP/v-out")
          check docker-build "$c8" "$c9" true  "custom Dockerfile path via the validate block's regex" "$custom_re"
          check docker-build "$c4" "$c5" true  "validate-block regex still catches nested package.json" "$custom_re"
          check docker-build "$c3" "$c4" false "validate-block regex still ignores lookalikes" "$custom_re"
          exit "$fails"

  # test-env is data. Same extraction approach: run the real block on hostile input.
  test-env-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Valid lines are written, injection attempts are rejected
        run: |
          set -euo pipefail
          sed -n '/# >>> test-env$/,/# <<< test-env$/p' .github/workflows/node-ci.yml | sed '1d;$d' > "$RUNNER_TEMP/test-env.sh"
          [ -s "$RUNNER_TEMP/test-env.sh" ] || { echo "::error::test-env block not found"; exit 1; }
          fails=0
          run_block() { : > "$RUNNER_TEMP/gh-env"; TEST_ENV=$1 GITHUB_ENV="$RUNNER_TEMP/gh-env" bash "$RUNNER_TEMP/test-env.sh" > /dev/null 2>&1; }
          expect_fail() {
            if run_block "$1"; then echo "::error::accepted: $2"; fails=1; else echo "ok   rejected: $2"; fi
            if grep -qE '^(GITHUB_|PATH=|BASH_ENV)' "$RUNNER_TEMP/gh-env"; then echo "::error::dangerous key reached GITHUB_ENV: $2"; fails=1; fi
          }
          if run_block $'A=1\n  B=x y=z\n\nC='; then
            [ "$(cat "$RUNNER_TEMP/gh-env")" = $'A=1\nB=x y=z\nC=' ] || { echo "::error::wrong GITHUB_ENV content"; fails=1; }
            echo "ok   valid lines written"
          else echo "::error::valid input rejected"; fails=1; fi
          expect_fail $'A=1\nGITHUB_PATH=/evil' "second line smuggles GITHUB_PATH"
          expect_fail 'GITHUB_ENV=/x' "GITHUB_ prefix"
          expect_fail 'PATH=/evil' "PATH"
          expect_fail 'BASH_ENV=/evil' "BASH_ENV"
          expect_fail 'LD_PRELOAD=/evil.so' "LD_PRELOAD"
          expect_fail 'CHANGE_RE=x' "CHANGE_RE (would skip the audit)"
          expect_fail 'NPM_CONFIG_REGISTRY=https://evil.example' "NPM_CONFIG_REGISTRY"
          expect_fail 'npm_config_registry=https://evil.example' "npm_config_registry"
          expect_fail 'GIT_DIR=/x' "GIT_ prefix"
          expect_fail 'HOME=/tmp/x' "HOME"
          expect_fail 'NO_EQUALS_SIGN' "no ="
          expect_fail '1BAD=x' "key starts with a digit"
          expect_fail '=x' "empty key"
          expect_fail 'A B=c' "space in key"
          expect_fail $'A=b\rc' "carriage return inside value"
          expect_fail $'A=1\n$(id)' "command text line"
          exit "$fails"

  actionlint-rejects-bad-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum verified)
        run: |
          set -euo pipefail
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: actionlint must exit 1 on the planted fixture
        run: |
          set +e
          out=$(actionlint -no-color fixtures/actionlint-bad/bad.yml 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 1 ]; then echo "::error::expected actionlint exit 1, got $rc"; exit 1; fi
          grep -q '\[job-needs\]' <<<"$out" || { echo "::error::expected a job-needs finding"; exit 1; }
          echo "OK: actionlint rejected the planted workflow"

  zizmor-rejects-bad-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor (checksum verified)
        run: |
          set -euo pipefail
          f="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$f"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" zizmor
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: zizmor must exit non-zero on the planted fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(zizmor --format plain fixtures/zizmor-bad/bad.yml 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "::error::zizmor accepted the planted fixture"; exit 1; fi
          grep -q 'template-injection' <<<"$out" || { echo "::error::expected a template-injection finding (exit $rc)"; exit 1; }
          echo "OK: zizmor rejected the planted workflow (exit $rc)"

  gitleaks-rejects-planted-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Control scan passes, then a run-time fake token must fail
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/plant"
          mkdir -p "$d"
          echo "nothing secret here" > "$d/notes.txt"
          gitleaks dir --no-banner --redact "$d"
          echo "OK: control scan is clean"

          # Fake token, generated now and never committed or reused.
          suffix=$(openssl rand -hex 18)
          [ "${#suffix}" -eq 36 ]
          printf 'github_token = "ghp_%s"\n' "$suffix" > "$d/config.txt"

          set +e
          out=$(gitleaks dir --no-banner --redact --verbose "$d" 2>&1)
          rc=$?
          set -e
          echo "${out//"$suffix"/<redacted>}"
          if [ "$rc" -eq 0 ]; then echo "::error::gitleaks accepted the planted token"; exit 1; fi
          grep -q 'github-pat' <<<"$out" || { echo "::error::expected a github-pat finding (exit $rc)"; exit 1; }
          echo "OK: gitleaks rejected the planted token (exit $rc)"

  pins-match-reusable-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool pins in self-test equal the reusable workflows
        run: |
          set -euo pipefail
          get() { grep -hE "^ +$1:" "$2" | head -1 | sed -E 's/^ +[A-Z0-9_]+: *//; s/"//g'; }
          check() {
            local var=$1 file=$2
            local a b
            a=$(get "$var" .github/workflows/self-test.yml)
            b=$(get "$var" "$file")
            if [ -z "$a" ] || [ "$a" != "$b" ]; then
              echo "::error::$var differs: self-test='$a' $file='$b'"; return 1
            fi
            echo "ok $var"
          }
          rc=0
          for v in ACTIONLINT_VERSION ACTIONLINT_SHA256 ZIZMOR_VERSION ZIZMOR_SHA256; do
            check "$v" .github/workflows/workflow-lint.yml || rc=1
          done
          for v in GITLEAKS_VERSION GITLEAKS_SHA256; do
            check "$v" .github/workflows/secret-scan.yml || rc=1
          done
          for v in TRIVY_VERSION TRIVY_IMAGE_DIGEST; do
            check "$v" .github/workflows/docker-build.yml || rc=1
          done
          # The change helper is inline in both workflows; the copies must be identical.
          blk() { sed -n '/# >>> change-helper$/,/# <<< change-helper$/p' "$1" | sed '1d;$d'; }
          a=$(blk .github/workflows/node-ci.yml)
          b=$(blk .github/workflows/docker-build.yml)
          if [ -z "$a" ] || [ "$a" != "$b" ]; then
            echo "::error::change-helper differs between node-ci.yml and docker-build.yml"; rc=1
          else
            echo "ok change-helper identical in both workflows"
          fi
          exit "$rc"

  ci-ok:
    if: always()
    needs:
      - secret-scan
      - workflow-lint
      - node-ci
      - node-ci-no-install
      - docker-build
      - docker-build-outputs
      - output-assertions-unit
      - docker-build-input-cases
      - crashing-app-fails-boot-test
      - boot-test-rejects-redirect
      - trivy-gate-trips
      - npm-audit-gate-trips
      - change-helper-cases
      - test-env-validation
      - actionlint-rejects-bad-workflow
      - zizmor-rejects-bad-workflow
      - gitleaks-rejects-planted-token
      - pins-match-reusable-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
